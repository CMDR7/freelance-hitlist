name = "fl-hl-intelligence-api"
main = "worker-v28.js"
compatibility_date = "2026-08-17"

# V2.8 keeps persistence disabled while source-balanced live acquisition is validated.
# V2.9 D1 configuration must be added only after the intended database is explicitly provisioned
# and the Worker entry point is deliberately switched during a reviewed deployment.
#
# Example future binding:
# [[d1_databases]]
# binding = "DB"
# database_name = "fl-hl"
# database_id = "<created-in-cloudflare>"

[vars]
API_VERSION = "2.8.0"
