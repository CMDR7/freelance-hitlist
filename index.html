<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05060a">
<title>Freelancer // Intelligence Network</title>
<style>
html,body{width:100%;min-height:100%;margin:0;background:#05060a}
#app-frame{display:block;width:100%;height:100vh;border:0;background:#05060a}
</style>
</head>
<body>
<iframe id="app-frame" src="legacy.html" title="Freelancer Intelligence Network"></iframe>
<script>
const frame=document.getElementById('app-frame');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc||doc.getElementById('flhl-brief-refactor'))return;
  const style=doc.createElement('style');
  style.id='flhl-brief-refactor';
  style.textContent=`
    .notes{width:min(100%,390px)!important;max-width:390px!important;max-height:150px!important;overflow:auto!important;padding:10px 12px!important;border:1px solid rgba(255,255,255,.10)!important;border-radius:7px!important;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(5,6,10,.38))!important;color:#c5cad6!important;font-size:.88rem!important;line-height:1.45!important;scrollbar-width:thin;scrollbar-color:rgba(51,255,217,.45) transparent}
    .notes::-webkit-scrollbar{width:6px}.notes::-webkit-scrollbar-thumb{background:rgba(51,255,217,.38);border-radius:99px}
    @media(max-width:640px){.notes{width:100%!important;max-width:none!important;max-height:180px!important;font-size:.9rem!important}}
  `;
  doc.head.appendChild(style);
  const observer=new MutationObserver(()=>{
    doc.querySelectorAll('.notes:not([data-intel-brief])').forEach(node=>{
      node.dataset.intelBrief='true';
      const cell=node.closest('td');
      if(cell){cell.style.minWidth='360px';}
    });
  });
  observer.observe(doc.body,{childList:true,subtree:true});
  doc.querySelectorAll('.notes').forEach(node=>node.dataset.intelBrief='true');
});
</script>
</body>
</html>
