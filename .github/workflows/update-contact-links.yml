name: Update Contact Links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contact-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace contact links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="mailto:art@example.com"><span>Email</span>', 'href="https://www.linkedin.com/in/arthurrambojr" target="_blank" rel="noopener noreferrer"><span>LinkedIn</span>')
          s = s.replace('href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"><span>LinkedIn</span>', 'href="https://www.instagram.com/multistop_?igsh=d2t5YWh1bjVqd2s1" target="_blank" rel="noopener noreferrer"><span>Instagram</span>')
          needle = '<a class="social" href="https://github.com/CMDR7" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span>↗</span></a>'
          replacement = needle + '\n<a class="social" href="https://substack.com/chat/4158654" target="_blank" rel="noopener noreferrer"><span>Substack Chat</span><span>↗</span></a>'
          if 'https://substack.com/chat/4158654' not in s:
              s = s.replace(needle, replacement)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No contact link changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: update contact modal destinations"
          git push